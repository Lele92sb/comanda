<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comanda — Banco dei componenti</title>

<!-- IL TEMA SI APPLICA PRIMA DI TUTTO. I moduli ES sono differiti: aspettarli
     vorrebbe dire un lampo di tema sbagliato a ogni apertura dell'app. Sono
     quattro righe, e stanno qui apposta. -->
<script>
  try{
    var t = localStorage.getItem('comanda_tema');
    if(t === 'chiaro' || t === 'scuro') document.documentElement.setAttribute('data-tema', t);
  }catch(e){}
</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap">

<!-- SOLO I TOKEN, non styles.css. E' voluto ed e' la regola di questo banco:
     qui un componente ha a disposizione esattamente quello che avra' dentro il
     suo shadow DOM, cioe' le variabili e nient'altro. Se si vede bene qui, si
     vede bene ovunque. Caricando il foglio dell'app, invece, un componente a
     cui mancasse uno stile lo prenderebbe in prestito dal foglio globale e il
     buco si scoprirebbe solo il giorno in cui lo si usa da un'altra parte. -->
<link rel="stylesheet" href="./src/ds/tokens.css">
</head>
<body>
<div id="banco"></div>
<script type="module" src="./src/banco/banco.ts"></script>
</body>
</html>
