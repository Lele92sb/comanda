name: Test e Rilascio

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

# Un rilascio alla volta per ambiente, e vince sempre l'ultimo commit.
#
# Con cancel-in-progress a false i push ravvicinati si mettevano in fila:
# bastava che il primo si impantanasse perché tutti i successivi restassero
# in attesa. Ma la build di un commit ormai superato non serve a nessuno —
# annullarla è più sicuro che accodarla, perché evita anche che una
# pubblicazione vecchia arrivi dopo una nuova.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Esegui i test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Deve stare al passo con "engines" in package.json. I test caricano
          # moduli TypeScript direttamente, cosa che Node sa fare solo dalla
          # 22.6 in poi: sulla 20 la pipeline falliva prima ancora di provare
          # una riga di codice.
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      # Un simbolo usato ma non importato non lo vede ne' il compilatore ne'
      # il bundler: esplode solo a schermo, davanti a chi usa l'app.
      - run: npm run lint:import
      # Un token che non esiste non lo segnala nessuno: tsc non guarda dentro
      # un template css``, la build lo copia, e il browser applica il valore
      # iniziale e va avanti. Restano le barre invisibili e le parole attaccate.
      - run: npm run lint:token
      # Un nome che non esiste non e' un errore di sintassi: la build passa, tsc
      # non guarda i .js, e il ReferenceError parte a meta' funzione lasciando la
      # schermata com'era. E' successo due volte in due giorni.
      - run: npm run lint:js
      # La build fa da controllo strutturale: un import verso un simbolo che
      # non esiste piu' ferma qui il rilascio, non davanti all'utente.
      - run: npm run build
      # LE PROVE SUI CLIC. Tutto quello che sta sopra gira senza una pagina, e
      # gli ultimi difetti veri erano tutti di comportamento: il chip che si
      # accendeva da solo, il riquadro che si richiudeva sotto le mani, il
      # riepilogo che spariva per un ReferenceError a meta' funzione. Li ha
      # trovati lo chef usando l'app in cucina. Da qui in poi li trova la
      # pipeline: si apre un browser vero, si clicca, e se la console scrive un
      # errore la prova fallisce anche se a schermo sembrava tutto a posto.
      #
      # Solo Chromium, e senza le altre due famiglie di browser: l'app si usa
      # su un telefono in cucina e su un portatile, e tre browser costerebbero
      # il triplo del tempo per trovare le stesse cose.
      - run: npx playwright install --with-deps chromium
      - run: npm run prova:clic
      # Quando una prova sui clic fallisce, la traccia e' il filmato dei clic
      # con il DOM a ogni passo: senza, resta solo il nome della prova.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tracce-delle-prove
          path: test-results/
          retention-days: 7

  deploy:
    name: Pubblica su Cloudflare Pages
    runs-on: ubuntu-latest
    needs: test          # se i test falliscono, non si pubblica niente
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Deve stare al passo con "engines" in package.json. I test caricano
          # moduli TypeScript direttamente, cosa che Node sa fare solo dalla
          # 22.6 in poi: sulla 20 la pipeline falliva prima ancora di provare
          # una riga di codice.
          node-version: '24'
          cache: npm
      - run: npm ci
      # L'ambiente lo decide il BRANCH, non l'indirizzo su cui si finisce.
      # main -> database di produzione; qualunque altro branch -> quello di prova.
      - run: npm run build
        env:
          COMANDA_AMBIENTE: ${{ github.ref_name == 'main' && 'produzione' || 'test' }}
      # Crea il progetto Pages se non esiste ancora. Fallisce con un errore
      # innocuo quando c'e' gia', e per questo l'errore viene ignorato: cosi'
      # il primo rilascio non richiede nessun passaggio manuale nella
      # dashboard, che e' un passaggio che si dimentica.
      - name: Prepara il progetto Pages
        run: npx --yes wrangler@4 pages project create comanda --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # main → indirizzo di produzione; staging → staging.<progetto>.pages.dev
      - name: Deploy
        run: npx --yes wrangler@4 pages deploy dist --project-name=comanda --branch=${{ github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
