name: Test e Rilascio

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

# Un rilascio alla volta per ambiente: evita che due push ravvicinati si
# sovrascrivano a vicenda a metà pubblicazione.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Esegui i test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test

  deploy:
    name: Pubblica su Cloudflare Pages
    runs-on: ubuntu-latest
    needs: test          # se i test falliscono, non si pubblica niente
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # main → indirizzo di produzione; staging → staging.<progetto>.pages.dev
      - name: Deploy
        run: npx --yes wrangler@4 pages deploy --project-name=comanda --branch=${{ github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
