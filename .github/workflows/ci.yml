name: Test e Rilascio

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

# Un rilascio alla volta per ambiente: evita che due push ravvicinati si
# sovrascrivano a vicenda a metà pubblicazione.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Esegui i test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      # Un simbolo usato ma non importato non lo vede ne' il compilatore ne'
      # il bundler: esplode solo a schermo, davanti a chi usa l'app.
      - run: npm run lint:import
      # La build fa da controllo strutturale: un import verso un simbolo che
      # non esiste piu' ferma qui il rilascio, non davanti all'utente.
      - run: npm run build

  deploy:
    name: Pubblica su Cloudflare Pages
    runs-on: ubuntu-latest
    needs: test          # se i test falliscono, non si pubblica niente
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      # main → indirizzo di produzione; staging → staging.<progetto>.pages.dev
      - name: Deploy
        run: npx --yes wrangler@4 pages deploy dist --project-name=comanda --branch=${{ github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
